<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smsd — SMS History</title>
<meta name="smsd-token" content="%SMSD_TOKEN%">
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #232732; --border: #2c313c;
    --fg: #e6e8ec; --muted: #8b93a1; --accent: #2196f3; --in: #232732; --out: #1f3a54;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7; --panel: #ffffff; --panel2: #eef0f3; --border: #dfe3e8;
      --fg: #1a1d22; --muted: #6b7280; --accent: #1976d2; --in: #eef0f3; --out: #d6ebff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex: 0 0 auto;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .tag { color: var(--muted); font-size: 12px; }
  #search {
    margin-left: auto; width: 320px; max-width: 45vw; padding: 7px 10px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); font-size: 13px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  main { display: flex; flex: 1 1 auto; min-height: 0; }
  #pane { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #list {
    width: 320px; flex: 0 0 320px; overflow-y: auto; border-right: 1px solid var(--border);
    background: var(--panel);
  }
  .conv {
    padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .conv:hover { background: var(--panel2); }
  .conv.active { background: var(--panel2); border-left: 3px solid var(--accent); padding-left: 11px; }
  .conv .name { font-weight: 600; }
  .conv .preview { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  #thread { flex: 1 1 auto; overflow-y: auto; padding: 16px 20px; min-width: 0; min-height: 0; }
  #thread .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  /* The title needs an opaque, full-bleed background or messages scroll through
     it. Negative margins cover the scroll area's padding, and top: -16px cancels
     its padding-top, which sticky would otherwise treat as the pinning edge and
     leave a strip of message visible above the title. */
  #thread h2 {
    font-size: 15px; position: sticky; top: -16px; z-index: 1;
    margin: -16px -20px 14px; padding: 12px 20px; background: var(--bg);
  }
  .bubble {
    max-width: 68%; padding: 8px 12px; border-radius: 12px; margin: 6px 0;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .bubble.in { background: var(--in); border-bottom-left-radius: 3px; }
  .bubble.out { background: var(--out); margin-left: auto; border-bottom-right-radius: 3px; }
  .bubble .ts { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; }
  .searchhit .addr { color: var(--muted); font-size: 11px; }
  .loadmore {
    display: block; margin: 0 auto 12px; padding: 6px 14px; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); font: inherit; font-size: 12px;
  }
  .loadmore:hover { border-color: var(--accent); }
  .loadmore[hidden] { display: none; }
  .loadmore[disabled] { color: var(--muted); cursor: default; border-color: var(--border); }
  #list .listend { padding: 10px 14px; color: var(--muted); font-size: 12px; text-align: center; }
  #list .listend button {
    display: block; margin: 6px auto 0; padding: 4px 10px; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); font: inherit; font-size: 12px;
  }
  #list .listend button:hover { border-color: var(--accent); }
  .scope { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .scope select {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); font: inherit; font-size: 12px; padding: 5px 8px;
  }
  .scope select:focus { outline: none; border-color: var(--accent); }
  .scope[hidden] { display: none; }
  .tabs { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .tabs button {
    background: var(--panel2); border: 0; color: var(--muted); font: inherit; font-size: 12px;
    padding: 5px 12px; cursor: pointer;
  }
  .tabs button + button { border-left: 1px solid var(--border); }
  .tabs button.on { background: var(--accent); color: #fff; }
  /* Nothing is removed when the phone deletes it; it is kept and marked. */
  .bubble.deleted { opacity: .6; outline: 1px dashed var(--muted); outline-offset: -1px; }
  .gone {
    display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .02em;
    color: var(--muted); border: 1px solid var(--border); border-radius: 4px;
    padding: 0 5px; margin-left: 6px; vertical-align: 1px;
  }
  .conv.deleted .name { color: var(--muted); }
  .star { color: #f5b301; margin-left: 4px; }
  .card h2 .gone { font-size: 11px; }
  .card .banner { color: var(--muted); font-size: 12px; margin: -6px 0 14px; }
  .card h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 18px 0 6px; font-weight: 600;
  }
  .card .field {
    display: flex; align-items: baseline; gap: 12px; padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .card .field .label { color: var(--muted); font-size: 12px; width: 110px; flex: 0 0 110px; }
  .card .field .value { white-space: pre-wrap; word-wrap: break-word; min-width: 0; flex: 1 1 auto; }
  .card .field.deleted .value { text-decoration: line-through; color: var(--muted); }
  .card .field a { color: var(--accent); }
  .card .field button {
    flex: 0 0 auto; padding: 3px 9px; cursor: pointer; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; color: var(--fg); font: inherit; font-size: 12px;
  }
  .card .field button:hover { border-color: var(--accent); }
  .bubble.pending, .bubble.failed { opacity: .75; }
  .bubble.failed { outline: 1px solid #e5484d; outline-offset: -1px; }
  .bubble .status.failed { color: #e5484d; font-weight: 600; }
  #compose {
    flex: 0 0 auto; border-top: 1px solid var(--border); background: var(--panel);
    padding: 10px 20px; display: flex; flex-direction: column; gap: 6px;
  }
  #compose[hidden] { display: none; }
  #compose .row { display: flex; gap: 10px; align-items: flex-end; }
  #compose textarea {
    flex: 1 1 auto; resize: none; min-height: 38px; max-height: 180px; padding: 8px 10px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--fg); font: inherit;
  }
  #compose textarea:focus, #to:focus { outline: none; border-color: var(--accent); }
  #compose button {
    padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  #compose button[disabled] { opacity: .45; cursor: default; }
  #compose .info { display: flex; gap: 12px; color: var(--muted); font-size: 11px; }
  #compose .info .error { color: #e5484d; }
  #compose .info .count { margin-left: auto; }
  .newmsg { display: flex; align-items: center; gap: 10px; }
  .newmsg label { color: var(--muted); }
  #to {
    flex: 1 1 auto; padding: 7px 10px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--fg); font: inherit;
  }
  .newbtn {
    padding: 5px 12px; cursor: pointer; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--fg); font: inherit; font-size: 12px;
  }
  .newbtn:hover { border-color: var(--accent); }
  .newbtn[hidden] { display: none; }
  /* Call log: a direction glyph per row, missed calls in red. */
  .conv .kind { display: inline-block; width: 1.3em; color: var(--muted); }
  .conv.missed .name, .conv.missed .kind, .calls .missed .kind { color: #e5484d; }
  .calls { margin-top: 6px; }
  .calls .field .label { width: 170px; flex-basis: 170px; }
  .calls .kind { display: inline-block; width: 1.3em; color: var(--muted); }
  .card .actions { display: flex; gap: 8px; margin: -4px 0 8px; }
  .card .actions button {
    padding: 3px 9px; cursor: pointer; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; color: var(--fg); font: inherit; font-size: 12px;
  }
  .card .actions button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>smsd</h1>
  <span class="tag">SMS history</span>
  <div class="tabs">
    <button id="tab-messages" class="on">Messages</button>
    <button id="tab-calls">Calls</button>
    <button id="tab-contacts">Contacts</button>
  </div>
  <label class="scope" id="scope-wrap">Show
    <select id="scope">
      <option value="30">last month</option>
      <option value="90">last 3 months</option>
      <option value="365">last year</option>
      <option value="0">everything</option>
    </select>
  </label>
  <label class="scope" id="cfilter-wrap" hidden>Show
    <select id="cfilter">
      <option value="all">all contacts</option>
      <option value="live">on the phone</option>
      <option value="deleted">deleted from the phone</option>
    </select>
  </label>
  <button id="new" class="newbtn" title="Write a new message">✎ New message</button>
  <input id="search" type="search" placeholder="Search name, number or message…" autocomplete="off">
</header>
<main>
  <div id="list"></div>
  <div id="pane">
    <div id="thread"><div class="empty">Select a conversation</div></div>
    <form id="compose" hidden>
      <div class="row">
        <textarea id="body" rows="1" placeholder="Write an SMS…"></textarea>
        <button id="send" type="submit">Send</button>
      </div>
      <div class="info"><span id="send-state">Ctrl+Enter to send</span><span class="count" id="count"></span></div>
    </form>
  </div>
</main>
<datalist id="recipients"></datalist>
<script>
// Histories here reach tens of thousands of messages across years, so nothing is
// rendered wholesale. The primary lever is the time window: it decides which
// conversations exist at all and which messages load, and defaults to the last
// month. Within the window everything still pages — the list as you scroll, a
// thread from its newest messages backwards — and the refresh poll only redraws
// when the database has actually changed.
const CONV_PAGE = 100;
const MSG_PAGE = 200;
const DAY_MS = 86400000;

const listEl = document.getElementById('list');
const threadEl = document.getElementById('thread');
const searchEl = document.getElementById('search');
const scopeEl = document.getElementById('scope');
const cfilterEl = document.getElementById('cfilter');

let mode = 'messages';     // 'messages', 'calls' or 'contacts'
const TOKEN = document.querySelector('meta[name="smsd-token"]').content;

let since = 0;             // window floor in epoch ms; 0 is the whole history
let convLoaded = 0;        // conversations currently in the list
let convDone = false;      // server has no more conversations
let convLoading = false;   // an append request is in flight
let active = null;         // address of the open conversation
let thread = null;         // open thread paging state
let lastToken = null;      // last /api/state fingerprint
let lastCallToken = null;  // the same for the call log, while on the Calls tab

// The floor is fixed when the window changes rather than recomputed per
// request, so the list cannot shift under the reader between polls.
function applyScope() {
  const days = Number(scopeEl.value);
  since = days > 0 ? Date.now() - days * DAY_MS : 0;
}
function scopeLabel() {
  return scopeEl.options[scopeEl.selectedIndex].text;
}

function fmtDate(ms) {
  if (!ms) return '';
  const d = new Date(Number(ms));
  return d.toLocaleString();
}
function esc(s) {
  return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + ': ' + r.status);
  return await r.json();
}

/* ---------- conversation list ---------- */

function convRow(c) {
  const div = document.createElement('div');
  div.className = 'conv';
  div.dataset.address = c.address;
  fillConvRow(div, c);
  div.onclick = () => openThread(c.address);
  return div;
}

// The signature lets a refresh skip rows whose rendering would not change,
// which is what keeps an idle list from flickering.
function fillConvRow(div, c) {
  const sig = c.last_date + '|' + c.count + '|' + c.contact_name + '|' + c.last_body;
  if (div.dataset.sig === sig) return;
  div.dataset.sig = sig;
  div.dataset.title = c.contact_name || c.address;
  div.innerHTML =
    '<div class="name">' + esc(div.dataset.title) + '</div>' +
    '<div class="preview">' + esc(c.last_body) + '</div>' +
    '<div class="meta">' + esc(fmtDate(c.last_date)) + ' · ' + c.count + ' msgs</div>';
}

// Rebuilds the list from convs, reusing the existing row elements so scroll
// position, hover and the active highlight all survive a refresh.
function renderConvList(convs) {
  const existing = new Map();
  for (const el of listEl.querySelectorAll('.conv[data-address]')) {
    existing.set(el.dataset.address, el);
  }
  const frag = document.createDocumentFragment();
  for (const c of convs) {
    let el = existing.get(c.address);
    if (el) { fillConvRow(el, c); existing.delete(c.address); } else { el = convRow(c); }
    el.classList.toggle('active', c.address === active);
    frag.appendChild(el);
  }
  listEl.replaceChildren(frag);
  if (convDone) listEl.appendChild(listFooter(convs.length));
}

// Says how much of the history is in view and offers the way out of the window,
// so a short list never looks like missing data.
function listFooter(n) {
  const foot = document.createElement('div');
  foot.className = 'listend';
  if (since === 0) {
    foot.textContent = n === 0 ? 'No messages yet' : n + ' conversations';
    return foot;
  }
  foot.textContent = n === 0
    ? 'No conversations in the ' + scopeLabel()
    : n + ' conversation' + (n === 1 ? '' : 's') + ' in the ' + scopeLabel();
  const btn = document.createElement('button');
  btn.textContent = 'Show everything';
  btn.onclick = () => { scopeEl.value = '0'; changeScope(); };
  foot.appendChild(btn);
  return foot;
}

function convQuery(offset) {
  return '/api/conversations?since=' + since + '&limit=' + CONV_PAGE +
    (offset ? '&offset=' + offset : '');
}

async function loadConversations() {
  const convs = await api(convQuery(0)) || [];
  if (mode !== 'messages') return; // the tab changed while loading
  convLoaded = convs.length;
  convDone = convs.length < CONV_PAGE;
  renderConvList(convs);
}

async function appendConversations() {
  if (mode !== 'messages' || convDone || convLoading || searchEl.value.trim()) return;
  convLoading = true;
  try {
    const convs = await api(convQuery(convLoaded)) || [];
    convDone = convs.length < CONV_PAGE;
    convLoaded += convs.length;
    const frag = document.createDocumentFragment();
    for (const c of convs) frag.appendChild(convRow(c));
    listEl.querySelector('.listend')?.remove();
    listEl.appendChild(frag);
    if (convDone) listEl.appendChild(listFooter(convLoaded));
  } finally {
    convLoading = false;
  }
}

// Re-fetch exactly what is on screen so appended pages are not lost.
async function refreshConvList() {
  const limit = Math.min(Math.max(convLoaded, CONV_PAGE), 1000);
  const convs = await api('/api/conversations?since=' + since + '&limit=' + limit) || [];
  convLoaded = convs.length;
  renderConvList(convs);
}

function changeScope() {
  localStorage.setItem('smsd.scope', scopeEl.value);
  applyScope();
  active = null;
  thread = null;
  newMode = false;
  updateCompose();
  threadEl.replaceChildren(Object.assign(document.createElement('div'),
    { className: 'empty', textContent: 'Select a conversation' }));
  listEl.scrollTop = 0;
  if (mode === 'calls') { activeCall = null; loadCalls(); } else loadConversations();
}
scopeEl.addEventListener('change', changeScope);

listEl.addEventListener('scroll', () => {
  if (listEl.scrollTop + listEl.clientHeight < listEl.scrollHeight - 200) return;
  if (mode === 'calls') appendCalls(); else appendConversations();
});

/* ---------- thread ---------- */

// Android message types that are not simply received or sent.
const TYPE_OUTBOX = 4, TYPE_FAILED = 5, TYPE_QUEUED = 6;

function bubbleEl(m) {
  const div = document.createElement('div');
  const pending = m.type === TYPE_OUTBOX || m.type === TYPE_QUEUED;
  const failed = m.type === TYPE_FAILED;
  div.className = 'bubble ' + (m.received ? 'in' : 'out') + (m.deleted_at ? ' deleted' : '') +
    (pending ? ' pending' : '') + (failed ? ' failed' : '');
  div.innerHTML = esc(m.body) + '<span class="ts">' + esc(fmtDate(m.date)) +
    (pending ? ' · sending…' : '') + (failed ? ' · <span class="status failed">not sent</span>' : '') +
    deletedNote(m) + '</span>';
  return div;
}

// deleted_at is when smsd noticed, not when the phone deleted it, hence the
// wording.
function deletedNote(m) {
  return m.deleted_at
    ? ' · <span title="noticed ' + esc(fmtDate(m.deleted_at)) + '">deleted from phone</span>'
    : '';
}

function threadTitle(address) {
  const row = listEl.querySelector('.conv[data-address="' + CSS.escape(address) + '"]');
  return (row && row.dataset.title) || address;
}

// opts.title names a thread that may not be in the list, and opts.all ignores
// the window — both for threads opened from a contact card.
async function openThread(address, opts = {}) {
  active = address;
  for (const el of listEl.querySelectorAll('.conv')) {
    el.classList.toggle('active', el.dataset.address === address);
  }

  switchDraft(address);
  newMode = false;
  const floor = opts.all ? 0 : since;
  const page = await api('/api/messages?address=' + encodeURIComponent(address) +
    '&since=' + floor + '&limit=' + MSG_PAGE);
  const msgs = page.messages || [];
  // thread.since mirrors the window until the reader asks for older messages,
  // at which point it drops to 0 for this thread only.
  thread = { address, since: floor, hasMore: page.has_more, oldest: msgs[0] || null,
    title: opts.title };

  threadEl.replaceChildren();
  const h2 = document.createElement('h2');
  h2.textContent = opts.title || threadTitle(address);
  threadEl.appendChild(h2);

  const more = document.createElement('button');
  more.className = 'loadmore';
  more.onclick = loadOlder;
  threadEl.appendChild(more);
  labelLoadMore(more);

  const bubbles = document.createElement('div');
  bubbles.id = 'bubbles';
  if (msgs.length === 0) {
    bubbles.innerHTML = '<div class="empty">No messages</div>';
  } else {
    const frag = document.createDocumentFragment();
    for (const m of msgs) frag.appendChild(bubbleEl(m));
    bubbles.appendChild(frag);
  }
  threadEl.appendChild(bubbles);
  showPending(address, msgs);
  threadEl.scrollTop = threadEl.scrollHeight;
  updateCompose();
}

// Inside the window the button pages backwards; once the window is exhausted it
// becomes the way out of the window for this thread.
function labelLoadMore(btn) {
  if (!thread) { btn.hidden = true; return; }
  if (thread.hasMore) {
    btn.textContent = '↑ Load ' + MSG_PAGE + ' older';
    btn.hidden = false;
  } else if (thread.since > 0) {
    btn.textContent = '↑ Load messages older than the ' + scopeLabel();
    btn.hidden = false;
  } else {
    btn.hidden = true;
  }
}

async function loadOlder() {
  if (!thread || !thread.oldest) return;
  // Out of messages inside the window: widen this thread to the full history.
  if (!thread.hasMore && thread.since > 0) thread.since = 0;

  const btn = threadEl.querySelector('.loadmore');
  const bubbles = document.getElementById('bubbles');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  try {
    const page = await api('/api/messages?address=' + encodeURIComponent(thread.address) +
      '&since=' + thread.since +
      '&before_date=' + thread.oldest.date + '&before_id=' + thread.oldest.android_id +
      '&limit=' + MSG_PAGE);
    const msgs = page.messages || [];
    thread.hasMore = page.has_more;
    if (msgs.length) thread.oldest = msgs[0];
    else thread.exhausted = true;

    // Prepending grows the document upwards, so shift the scroll offset by the
    // height gained to keep the reader looking at the same message.
    const before = threadEl.scrollHeight;
    const frag = document.createDocumentFragment();
    for (const m of msgs) frag.appendChild(bubbleEl(m));
    bubbles.insertBefore(frag, bubbles.firstChild);
    threadEl.scrollTop += threadEl.scrollHeight - before;
  } finally {
    btn.disabled = false;
    if (thread.exhausted) btn.hidden = true; else labelLoadMore(btn);
  }
}

/* ---------- search ---------- */

let searchTimer = null;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  if (mode === 'contacts') { renderContactList(); return; }
  if (mode === 'calls') { renderCallList(); return; }
  const q = searchEl.value.trim();
  searchTimer = setTimeout(() => q ? runSearch(q) : loadConversations(), 200);
});

async function runSearch(q) {
  const hits = await api('/api/search?q=' + encodeURIComponent(q)) || [];
  active = null;
  thread = null;
  newMode = false;
  updateCompose();
  for (const el of listEl.querySelectorAll('.conv')) el.classList.remove('active');

  let html = '<h2>' + hits.length + ' result' + (hits.length === 1 ? '' : 's') + ' for “' + esc(q) + '”</h2>';
  if (hits.length === 0) html += '<div class="empty">No matches</div>';
  for (const m of hits) {
    html += '<div class="bubble ' + (m.received ? 'in' : 'out') + (m.deleted_at ? ' deleted' : '') + ' searchhit">' +
      '<div class="addr">' + esc(m.address) + ' · ' + esc(fmtDate(m.date)) + deletedNote(m) + '</div>' +
      esc(m.body) + '</div>';
  }
  threadEl.innerHTML = html;
  threadEl.scrollTop = 0;
}

/* ---------- contacts ---------- */

// A phone book is a few hundred entries, so the whole list is fetched when the
// tab opens and filtered here rather than paged from the server.
const KIND_TITLES = {
  phone: 'Phone', email: 'Email', address: 'Address', organization: 'Organization',
  website: 'Website', event: 'Date', nickname: 'Nickname', note: 'Note',
};

let contacts = [];         // /api/contacts, everything including deleted
let activeContact = null;  // id of the open card

async function loadContacts() {
  contacts = await api('/api/contacts') || [];
  if (mode === 'contacts') renderContactList();
}

function contactTitle(c) {
  return c.name || c.phone || '(no name)';
}

function renderContactList() {
  const q = searchEl.value.trim().toLowerCase();
  const digits = q.replace(/\D/g, '');
  const filter = cfilterEl.value;
  const shown = contacts.filter(c =>
    (filter === 'all' || (filter === 'deleted') === Boolean(c.deleted_at)) &&
    (!q || c.name.toLowerCase().includes(q) ||
      (digits && c.phone.replace(/\D/g, '').includes(digits))));

  const frag = document.createDocumentFragment();
  for (const c of shown) {
    const div = document.createElement('div');
    div.className = 'conv' + (c.deleted_at ? ' deleted' : '') + (c.id === activeContact ? ' active' : '');
    div.dataset.contact = c.id;
    div.innerHTML =
      '<div class="name">' + esc(contactTitle(c)) + (c.starred ? '<span class="star">★</span>' : '') +
      (c.deleted_at ? '<span class="gone">DELETED</span>' : '') + '</div>' +
      (c.name && c.phone ? '<div class="meta">' + esc(c.phone) + '</div>' : '');
    div.onclick = () => openContact(c.id);
    frag.appendChild(div);
  }
  const foot = document.createElement('div');
  foot.className = 'listend';
  const gone = contacts.filter(c => c.deleted_at).length;
  foot.textContent = shown.length + ' of ' + contacts.length + ' contacts' +
    (gone ? ' · ' + gone + ' deleted from the phone' : '');
  frag.appendChild(foot);
  listEl.replaceChildren(frag);
}

async function openContact(id) {
  activeContact = id;
  for (const el of listEl.querySelectorAll('.conv')) {
    el.classList.toggle('active', Number(el.dataset.contact) === id);
  }
  const c = await api('/api/contact?id=' + id);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h2>' + esc(contactTitle(c)) + (c.starred ? '<span class="star">★</span>' : '') +
    (c.deleted_at ? '<span class="gone">DELETED</span>' : '') + '</h2>' +
    (c.deleted_at ? '<div class="banner">Deleted from the phone · noticed ' + esc(fmtDate(c.deleted_at)) + '</div>' : '');

  let kind = null;
  for (const d of c.details) {
    if (d.kind !== kind) {
      kind = d.kind;
      card.appendChild(Object.assign(document.createElement('h3'), { textContent: KIND_TITLES[kind] || kind }));
    }
    const row = document.createElement('div');
    row.className = 'field' + (d.deleted_at ? ' deleted' : '');
    row.innerHTML = '<span class="label">' + esc(d.label) + '</span>' +
      '<span class="value">' + detailValue(d) + '</span>' +
      (d.deleted_at ? '<span class="gone" title="noticed ' + esc(fmtDate(d.deleted_at)) + '">REMOVED</span>' : '');
    if (d.conversation) {
      const btn = document.createElement('button');
      btn.textContent = 'Messages →';
      btn.onclick = () => showConversation(d.conversation, contactTitle(c));
      row.appendChild(btn);
    } else if (d.kind === 'phone' && !d.deleted_at) {
      const btn = document.createElement('button');
      btn.textContent = 'Write SMS →';
      btn.onclick = async () => { await setMode('messages'); newMessage(d.value); };
      row.appendChild(btn);
    }
    card.appendChild(row);
  }
  if (c.details.length === 0) {
    card.appendChild(Object.assign(document.createElement('div'), { className: 'empty', textContent: 'No details' }));
  }
  threadEl.replaceChildren(card);
  threadEl.scrollTop = 0;
}

// Values are shown as text; only e-mail and plain http(s) links become links,
// so nothing stored on the phone can smuggle in a javascript: URL.
function detailValue(d) {
  const v = esc(d.value);
  if (d.kind === 'email') return '<a href="mailto:' + v + '">' + v + '</a>';
  if (d.kind === 'website' && /^https?:\/\//i.test(d.value)) {
    return '<a href="' + v + '" target="_blank" rel="noopener noreferrer">' + v + '</a>';
  }
  return v;
}

async function showConversation(address, title) {
  await setMode('messages');
  await openThread(address, { title, all: true });
}

/* ---------- calls ---------- */

// The call log shares the time window with the conversation list and pages the
// same way, newest first. Search filters the calls already loaded.
const CALL_PAGE = 200;
const CALL_KINDS = {
  1: ['↙', 'Incoming'], 2: ['↗', 'Outgoing'], 3: ['✕', 'Missed'], 4: ['⌁', 'Voicemail'],
  5: ['⊘', 'Rejected'], 6: ['⊘', 'Blocked'], 7: ['↙', 'Answered elsewhere'],
};
const TYPE_MISSED = 3;

let calls = [];            // loaded call log rows, newest first
let callsMore = false;     // older calls remain inside the window
let callsLoading = false;
let activeCall = null;     // key of the open call row

function callKey(c) { return c.date + ':' + c.android_id; }
function callKind(c) { return CALL_KINDS[c.type] || ['·', 'Call']; }

function fmtDuration(sec) {
  if (!sec) return '';
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return (h ? h + 'h ' : '') + (h || m ? m + 'm ' : '') + s + 's';
}

function callsQuery(extra) {
  return '/api/calls?since=' + since + '&limit=' + CALL_PAGE + (extra || '');
}

async function loadCalls() {
  const page = await api(callsQuery());
  if (mode !== 'calls') return;
  calls = page.calls || [];
  callsMore = page.has_more;
  renderCallList();
}

async function appendCalls() {
  if (mode !== 'calls' || !callsMore || callsLoading || !calls.length) return;
  callsLoading = true;
  try {
    const last = calls[calls.length - 1];
    const page = await api(callsQuery('&before_date=' + last.date + '&before_id=' + last.android_id));
    calls = calls.concat(page.calls || []);
    callsMore = page.has_more;
    renderCallList();
  } finally {
    callsLoading = false;
  }
}

// Re-fetch as many calls as are on screen, so a refresh keeps appended pages.
async function refreshCalls() {
  const limit = Math.min(Math.max(calls.length, CALL_PAGE), 1000);
  const page = await api('/api/calls?since=' + since + '&limit=' + limit);
  calls = page.calls || [];
  callsMore = page.has_more;
  renderCallList();
}

function renderCallList() {
  const q = searchEl.value.trim().toLowerCase();
  const digits = q.replace(/\D/g, '');
  const shown = calls.filter(c => !q || c.caller.toLowerCase().includes(q) ||
    (digits && c.number.replace(/\D/g, '').includes(digits)));
  const top = listEl.scrollTop;
  const frag = document.createDocumentFragment();
  for (const c of shown) {
    const [glyph, label] = callKind(c);
    const div = document.createElement('div');
    div.className = 'conv' + (c.type === TYPE_MISSED ? ' missed' : '') +
      (c.deleted_at ? ' deleted' : '') + (callKey(c) === activeCall ? ' active' : '');
    div.innerHTML =
      '<div class="name"><span class="kind" title="' + label + '">' + glyph + '</span>' + esc(c.caller) +
      (c.deleted_at ? '<span class="gone">DELETED</span>' : '') + '</div>' +
      '<div class="meta">' + label + ' · ' + esc(fmtDate(c.date)) +
      (c.duration ? ' · ' + fmtDuration(c.duration) : '') + '</div>';
    div.onclick = () => openCall(c);
    frag.appendChild(div);
  }
  const foot = document.createElement('div');
  foot.className = 'listend';
  if (q) {
    foot.textContent = shown.length + ' of ' + calls.length + ' loaded calls';
  } else if (callsMore) {
    const btn = document.createElement('button');
    btn.textContent = 'Load older calls';
    btn.onclick = appendCalls;
    foot.appendChild(btn);
  } else if (since === 0) {
    foot.textContent = calls.length ? calls.length + ' calls' : 'No calls yet';
  } else {
    foot.textContent = calls.length
      ? calls.length + ' call' + (calls.length === 1 ? '' : 's') + ' in the ' + scopeLabel()
      : 'No calls in the ' + scopeLabel();
    const btn = document.createElement('button');
    btn.textContent = 'Show everything';
    btn.onclick = () => { scopeEl.value = '0'; changeScope(); };
    foot.appendChild(btn);
  }
  frag.appendChild(foot);
  listEl.replaceChildren(frag);
  listEl.scrollTop = top;
}

// A call opens the history with that number, across all time, and the way
// to message them.
async function openCall(c) {
  activeCall = callKey(c);
  renderCallList();
  const page = c.number
    ? await api('/api/calls?number=' + encodeURIComponent(c.number) + '&limit=' + CALL_PAGE)
    : { calls: [c], has_more: false };
  if (mode !== 'calls' || activeCall !== callKey(c)) return;

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h2>' + esc(c.caller) + '</h2>' +
    (c.contact_name ? '<div class="banner">' + esc(c.number) + '</div>' : '');
  const actions = document.createElement('div');
  actions.className = 'actions';
  if (c.conversation) {
    const btn = document.createElement('button');
    btn.textContent = 'Messages →';
    btn.onclick = () => showConversation(c.conversation, c.caller);
    actions.appendChild(btn);
  } else if (c.number) {
    const btn = document.createElement('button');
    btn.textContent = 'Write SMS →';
    btn.onclick = async () => { await setMode('messages'); newMessage(c.number); };
    actions.appendChild(btn);
  }
  card.appendChild(actions);

  const n = page.calls.length;
  card.appendChild(Object.assign(document.createElement('h3'), {
    textContent: page.has_more ? 'Latest ' + n + ' calls' : n + ' call' + (n === 1 ? '' : 's'),
  }));
  const list = document.createElement('div');
  list.className = 'calls';
  for (const h of page.calls) {
    const [glyph, label] = callKind(h);
    const row = document.createElement('div');
    row.className = 'field' + (h.type === TYPE_MISSED ? ' missed' : '') + (h.deleted_at ? ' deleted' : '');
    row.innerHTML = '<span class="label">' + esc(fmtDate(h.date)) + '</span>' +
      '<span class="value"><span class="kind">' + glyph + '</span>' + label +
      (h.duration ? ' · ' + fmtDuration(h.duration) : '') + '</span>' +
      (h.deleted_at ? '<span class="gone" title="noticed ' + esc(fmtDate(h.deleted_at)) + '">DELETED</span>' : '');
    list.appendChild(row);
  }
  card.appendChild(list);
  threadEl.replaceChildren(card);
  threadEl.scrollTop = 0;
}

/* ---------- compose ---------- */

// Sending is the viewer's one write. The server only accepts it with the
// per-run token from this page; see authorised in ui.go.
const composeEl = document.getElementById('compose');
const bodyEl = document.getElementById('body');
const sendBtn = document.getElementById('send');
const sendStateEl = document.getElementById('send-state');
const countEl = document.getElementById('count');

let newMode = false;        // composing to a recipient typed in by hand
let sendState = { can: false, error: 'checking…' };
let sending = false;
let notice = null;          // { text, error } from the last send, until typing
const drafts = new Map();   // address -> unsent text
let draftFor = null;
// Sends accepted by the phone but not imported yet, shown until they arrive.
const pendingSends = [];

function applySendState(s) {
  sendState = { can: Boolean(s.can_send), error: s.send_error || '' };
  updateCompose();
}

function recipient() {
  if (newMode) return document.getElementById('to')?.value.trim() || '';
  return thread ? thread.address : '';
}

function updateCompose() {
  composeEl.hidden = !(mode === 'messages' && (thread || newMode));
  const text = bodyEl.value;
  const parts = smsParts(text);
  countEl.textContent = text ? [...text].length + ' chars · ' + parts + ' SMS' : '';
  sendBtn.disabled = sending || !sendState.can || !text.trim() || !recipient();
  let msg = 'Ctrl+Enter to send', error = false;
  if (sending) msg = 'Sending…';
  else if (!sendState.can) { msg = sendState.error; error = true; }
  else if (notice) { msg = notice.text; error = notice.error; }
  sendStateEl.innerHTML = error ? '<span class="error">' + esc(msg) + '</span>' : esc(msg);
}

// Keeps unsent text with the conversation it was written in, so switching
// threads can never send it to someone else.
function switchDraft(address) {
  if (draftFor === address) return;
  if (draftFor !== null) {
    if (bodyEl.value) drafts.set(draftFor, bodyEl.value); else drafts.delete(draftFor);
  }
  draftFor = address;
  bodyEl.value = drafts.get(address) || '';
  autosize();
}

function autosize() {
  bodyEl.style.height = 'auto';
  bodyEl.style.height = bodyEl.scrollHeight + 2 + 'px';
}

bodyEl.addEventListener('input', () => { notice = null; autosize(); updateCompose(); });
bodyEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendMessage(); }
});
composeEl.addEventListener('submit', e => { e.preventDefault(); sendMessage(); });

async function sendMessage() {
  const address = recipient();
  const body = bodyEl.value;
  if (sendBtn.disabled || !address || !body.trim()) return;
  sending = true;
  notice = null;
  updateCompose();
  try {
    const r = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Smsd-Token': TOKEN },
      body: JSON.stringify({ address, body }),
    });
    if (!r.ok) throw new Error((await r.text()).trim() || r.status);
    // The server strips a number's formatting; that is the thread it lands in.
    const sentTo = (await r.json()).address || address;
    pendingSends.push({ address: sentTo, body, at: Date.now() });
    bodyEl.value = '';
    drafts.delete(address);
    autosize();
    if (newMode) {
      draftFor = sentTo;
      await openThread(sentTo, { all: true });
    } else {
      showPending(address, []);
      threadEl.scrollTop = threadEl.scrollHeight;
    }
    notice = { text: 'Handed to the phone for sending', error: false };
  } catch (err) {
    notice = { text: 'Not sent: ' + String(err.message || err), error: true };
  } finally {
    sending = false;
    updateCompose();
  }
}

// Shows sends for address that the import has not delivered yet. One counts
// as arrived once a sent message with the same text shows up after it.
function showPending(address, msgs) {
  const bubbles = document.getElementById('bubbles');
  if (!bubbles) return;
  bubbles.querySelectorAll('.bubble.local').forEach(el => el.remove());
  const now = Date.now();
  for (let i = pendingSends.length - 1; i >= 0; i--) {
    const p = pendingSends[i];
    const arrived = msgs.some(m => !m.received && m.body === p.body && m.date >= p.at - 60000);
    if (arrived || now - p.at > 10 * 60000) pendingSends.splice(i, 1);
  }
  for (const p of pendingSends) {
    if (p.address !== address) continue;
    const el = bubbleEl({ body: p.body, date: p.at, received: false, type: TYPE_OUTBOX });
    el.classList.add('local');
    bubbles.querySelector('.empty')?.remove();
    bubbles.appendChild(el);
  }
}

// A new conversation: pick a recipient, from contacts or typed in.
async function newMessage(to = '') {
  active = null;
  thread = null;
  newMode = true;
  for (const el of listEl.querySelectorAll('.conv')) el.classList.remove('active');
  switchDraft('');
  threadEl.innerHTML = '<h2>New message</h2>' +
    '<div class="newmsg"><label for="to">To</label>' +
    '<input id="to" list="recipients" autocomplete="off" placeholder="Number, or start typing a name"></div>';
  const toEl = document.getElementById('to');
  toEl.value = to;
  toEl.addEventListener('input', () => {
    // Picking "Name — number" from the list leaves just the number.
    const m = toEl.value.match(/ — ([+\d][\d\s()./-]*)$/);
    if (m) toEl.value = m[1].trim();
    updateCompose();
  });
  updateCompose();
  (to ? bodyEl : toEl).focus();

  if (!contacts.length) contacts = await api('/api/contacts') || [];
  const list = document.getElementById('recipients');
  list.replaceChildren(...contacts.filter(c => c.phone && !c.deleted_at).map(c =>
    Object.assign(document.createElement('option'), { value: c.name ? c.name + ' — ' + c.phone : c.phone })));
}
document.getElementById('new').onclick = () => newMessage();

// Mirrors sms.Split in Go, which decides for real: GSM 7-bit text fits 160
// characters (153 per part when split), anything else 70 (67 per part).
const GSM_BASIC = '@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&\'()*+,-./0123456789:;<=>?' +
  '¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà';
const GSM_EXT = '\f^{}\\[~]|€';
function smsParts(text) {
  if (!text) return 0;
  let gsm = true, septets = 0;
  for (const ch of text) {
    if (GSM_BASIC.includes(ch)) septets += 1;
    else if (GSM_EXT.includes(ch)) septets += 2;
    else { gsm = false; break; }
  }
  if (gsm) return septets <= 160 ? 1 : countParts(text, ch => GSM_EXT.includes(ch) ? 2 : 1, 153);
  if (text.length <= 70) return 1;
  return countParts(text, ch => ch.length, 67);
}
function countParts(text, size, per) {
  let parts = 1, used = 0;
  for (const ch of text) {
    const n = size(ch);
    if (used + n > per) { parts++; used = 0; }
    used += n;
  }
  return parts;
}

/* ---------- mode ---------- */

const tabs = {
  messages: document.getElementById('tab-messages'),
  calls: document.getElementById('tab-calls'),
  contacts: document.getElementById('tab-contacts'),
};
const EMPTY_TEXT = { messages: 'Select a conversation', calls: 'Select a call', contacts: 'Select a contact' };

async function setMode(m) {
  if (m === mode) return;
  mode = m;
  for (const [k, el] of Object.entries(tabs)) el.classList.toggle('on', k === m);
  document.getElementById('scope-wrap').hidden = m === 'contacts';
  document.getElementById('cfilter-wrap').hidden = m !== 'contacts';
  searchEl.value = '';
  searchEl.placeholder = m === 'messages' ? 'Search name, number or message…' : 'Search name or number…';
  activeCall = null;
  active = null;
  thread = null;
  newMode = false;
  activeContact = null;
  document.getElementById('new').hidden = m !== 'messages';
  updateCompose();
  threadEl.replaceChildren(Object.assign(document.createElement('div'),
    { className: 'empty', textContent: EMPTY_TEXT[m] }));
  listEl.scrollTop = 0;
  if (m === 'messages') await loadConversations();
  else if (m === 'calls') await loadCalls();
  else await loadContacts();
}
tabs.messages.onclick = () => setMode('messages');
tabs.calls.onclick = () => setMode('calls');
tabs.contacts.onclick = () => setMode('contacts');

cfilterEl.addEventListener('change', () => {
  localStorage.setItem('smsd.cfilter', cfilterEl.value);
  renderContactList();
});

/* ---------- refresh ---------- */

// Polling a fingerprint instead of the whole list means an idle viewer does no
// rendering work at all, and a busy one only redraws once per actual change.
async function poll() {
  const s = await api('/api/state');
  applySendState(s);
  const callToken = s.calls.count + ':' + s.calls.max_id + ':' + s.calls.deleted;
  if (mode === 'calls') {
    const first = lastCallToken === null;
    if (callToken !== lastCallToken && !first) await refreshCalls();
    lastCallToken = callToken;
    return;
  }
  lastCallToken = null;
  if (mode !== 'messages' || searchEl.value.trim()) return;
  const token = s.count + ':' + s.max_id + ':' + s.deleted;
  if (token === lastToken) return;
  const first = lastToken === null;
  lastToken = token;
  if (first) return;

  await refreshConvList();
  // Only pull new messages into an open thread when the reader is already at
  // the bottom; otherwise a refresh would yank them away from what they read.
  if (thread && threadEl.scrollTop + threadEl.clientHeight >= threadEl.scrollHeight - 40) {
    await openThread(thread.address, { title: thread.title, all: thread.since === 0 && since > 0 });
  }
}

const saved = localStorage.getItem('smsd.scope');
if (saved !== null && [...scopeEl.options].some(o => o.value === saved)) scopeEl.value = saved;
const savedFilter = localStorage.getItem('smsd.cfilter');
if (savedFilter !== null && [...cfilterEl.options].some(o => o.value === savedFilter)) cfilterEl.value = savedFilter;
applyScope();
loadConversations().then(poll).catch(() => {});
setInterval(() => poll().catch(() => {}), 5000);
</script>
