<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smsd — SMS History</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #232732; --border: #2c313c;
    --fg: #e6e8ec; --muted: #8b93a1; --accent: #2196f3; --in: #232732; --out: #1f3a54;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7; --panel: #ffffff; --panel2: #eef0f3; --border: #dfe3e8;
      --fg: #1a1d22; --muted: #6b7280; --accent: #1976d2; --in: #eef0f3; --out: #d6ebff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex: 0 0 auto;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .tag { color: var(--muted); font-size: 12px; }
  #search {
    margin-left: auto; width: 320px; max-width: 45vw; padding: 7px 10px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); font-size: 13px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  main { display: flex; flex: 1 1 auto; min-height: 0; }
  #list {
    width: 320px; flex: 0 0 320px; overflow-y: auto; border-right: 1px solid var(--border);
    background: var(--panel);
  }
  .conv {
    padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .conv:hover { background: var(--panel2); }
  .conv.active { background: var(--panel2); border-left: 3px solid var(--accent); padding-left: 11px; }
  .conv .name { font-weight: 600; }
  .conv .preview { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  #thread { flex: 1 1 auto; overflow-y: auto; padding: 16px 20px; min-width: 0; }
  #thread .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  /* The title needs an opaque, full-bleed background or messages scroll through
     it. Negative margins cover the scroll area's padding, and top: -16px cancels
     its padding-top, which sticky would otherwise treat as the pinning edge and
     leave a strip of message visible above the title. */
  #thread h2 {
    font-size: 15px; position: sticky; top: -16px; z-index: 1;
    margin: -16px -20px 14px; padding: 12px 20px; background: var(--bg);
  }
  .bubble {
    max-width: 68%; padding: 8px 12px; border-radius: 12px; margin: 6px 0;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .bubble.in { background: var(--in); border-bottom-left-radius: 3px; }
  .bubble.out { background: var(--out); margin-left: auto; border-bottom-right-radius: 3px; }
  .bubble .ts { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; }
  .searchhit .addr { color: var(--muted); font-size: 11px; }
  .loadmore {
    display: block; margin: 0 auto 12px; padding: 6px 14px; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); font: inherit; font-size: 12px;
  }
  .loadmore:hover { border-color: var(--accent); }
  .loadmore[hidden] { display: none; }
  .loadmore[disabled] { color: var(--muted); cursor: default; border-color: var(--border); }
  #list .listend { padding: 10px 14px; color: var(--muted); font-size: 12px; text-align: center; }
  #list .listend button {
    display: block; margin: 6px auto 0; padding: 4px 10px; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); font: inherit; font-size: 12px;
  }
  #list .listend button:hover { border-color: var(--accent); }
  .scope { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .scope select {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); font: inherit; font-size: 12px; padding: 5px 8px;
  }
  .scope select:focus { outline: none; border-color: var(--accent); }
  .scope[hidden] { display: none; }
  .tabs { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .tabs button {
    background: var(--panel2); border: 0; color: var(--muted); font: inherit; font-size: 12px;
    padding: 5px 12px; cursor: pointer;
  }
  .tabs button + button { border-left: 1px solid var(--border); }
  .tabs button.on { background: var(--accent); color: #fff; }
  /* Nothing is removed when the phone deletes it; it is kept and marked. */
  .bubble.deleted { opacity: .6; outline: 1px dashed var(--muted); outline-offset: -1px; }
  .gone {
    display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .02em;
    color: var(--muted); border: 1px solid var(--border); border-radius: 4px;
    padding: 0 5px; margin-left: 6px; vertical-align: 1px;
  }
  .conv.deleted .name { color: var(--muted); }
  .star { color: #f5b301; margin-left: 4px; }
  .card h2 .gone { font-size: 11px; }
  .card .banner { color: var(--muted); font-size: 12px; margin: -6px 0 14px; }
  .card h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 18px 0 6px; font-weight: 600;
  }
  .card .field {
    display: flex; align-items: baseline; gap: 12px; padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .card .field .label { color: var(--muted); font-size: 12px; width: 110px; flex: 0 0 110px; }
  .card .field .value { white-space: pre-wrap; word-wrap: break-word; min-width: 0; flex: 1 1 auto; }
  .card .field.deleted .value { text-decoration: line-through; color: var(--muted); }
  .card .field a { color: var(--accent); }
  .card .field button {
    flex: 0 0 auto; padding: 3px 9px; cursor: pointer; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; color: var(--fg); font: inherit; font-size: 12px;
  }
  .card .field button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>smsd</h1>
  <span class="tag">read-only SMS history</span>
  <div class="tabs">
    <button id="tab-messages" class="on">Messages</button>
    <button id="tab-contacts">Contacts</button>
  </div>
  <label class="scope" id="scope-wrap">Show
    <select id="scope">
      <option value="30">last month</option>
      <option value="90">last 3 months</option>
      <option value="365">last year</option>
      <option value="0">everything</option>
    </select>
  </label>
  <label class="scope" id="cfilter-wrap" hidden>Show
    <select id="cfilter">
      <option value="all">all contacts</option>
      <option value="live">on the phone</option>
      <option value="deleted">deleted from the phone</option>
    </select>
  </label>
  <input id="search" type="search" placeholder="Search name, number or message…" autocomplete="off">
</header>
<main>
  <div id="list"></div>
  <div id="thread"><div class="empty">Select a conversation</div></div>
</main>
<script>
// Histories here reach tens of thousands of messages across years, so nothing is
// rendered wholesale. The primary lever is the time window: it decides which
// conversations exist at all and which messages load, and defaults to the last
// month. Within the window everything still pages — the list as you scroll, a
// thread from its newest messages backwards — and the refresh poll only redraws
// when the database has actually changed.
const CONV_PAGE = 100;
const MSG_PAGE = 200;
const DAY_MS = 86400000;

const listEl = document.getElementById('list');
const threadEl = document.getElementById('thread');
const searchEl = document.getElementById('search');
const scopeEl = document.getElementById('scope');
const cfilterEl = document.getElementById('cfilter');

let mode = 'messages';     // 'messages' or 'contacts'

let since = 0;             // window floor in epoch ms; 0 is the whole history
let convLoaded = 0;        // conversations currently in the list
let convDone = false;      // server has no more conversations
let convLoading = false;   // an append request is in flight
let active = null;         // address of the open conversation
let thread = null;         // open thread paging state
let lastToken = null;      // last /api/state fingerprint

// The floor is fixed when the window changes rather than recomputed per
// request, so the list cannot shift under the reader between polls.
function applyScope() {
  const days = Number(scopeEl.value);
  since = days > 0 ? Date.now() - days * DAY_MS : 0;
}
function scopeLabel() {
  return scopeEl.options[scopeEl.selectedIndex].text;
}

function fmtDate(ms) {
  if (!ms) return '';
  const d = new Date(Number(ms));
  return d.toLocaleString();
}
function esc(s) {
  return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + ': ' + r.status);
  return await r.json();
}

/* ---------- conversation list ---------- */

function convRow(c) {
  const div = document.createElement('div');
  div.className = 'conv';
  div.dataset.address = c.address;
  fillConvRow(div, c);
  div.onclick = () => openThread(c.address);
  return div;
}

// The signature lets a refresh skip rows whose rendering would not change,
// which is what keeps an idle list from flickering.
function fillConvRow(div, c) {
  const sig = c.last_date + '|' + c.count + '|' + c.contact_name + '|' + c.last_body;
  if (div.dataset.sig === sig) return;
  div.dataset.sig = sig;
  div.dataset.title = c.contact_name || c.address;
  div.innerHTML =
    '<div class="name">' + esc(div.dataset.title) + '</div>' +
    '<div class="preview">' + esc(c.last_body) + '</div>' +
    '<div class="meta">' + esc(fmtDate(c.last_date)) + ' · ' + c.count + ' msgs</div>';
}

// Rebuilds the list from convs, reusing the existing row elements so scroll
// position, hover and the active highlight all survive a refresh.
function renderConvList(convs) {
  const existing = new Map();
  for (const el of listEl.querySelectorAll('.conv[data-address]')) {
    existing.set(el.dataset.address, el);
  }
  const frag = document.createDocumentFragment();
  for (const c of convs) {
    let el = existing.get(c.address);
    if (el) { fillConvRow(el, c); existing.delete(c.address); } else { el = convRow(c); }
    el.classList.toggle('active', c.address === active);
    frag.appendChild(el);
  }
  listEl.replaceChildren(frag);
  if (convDone) listEl.appendChild(listFooter(convs.length));
}

// Says how much of the history is in view and offers the way out of the window,
// so a short list never looks like missing data.
function listFooter(n) {
  const foot = document.createElement('div');
  foot.className = 'listend';
  if (since === 0) {
    foot.textContent = n === 0 ? 'No messages yet' : n + ' conversations';
    return foot;
  }
  foot.textContent = n === 0
    ? 'No conversations in the ' + scopeLabel()
    : n + ' conversation' + (n === 1 ? '' : 's') + ' in the ' + scopeLabel();
  const btn = document.createElement('button');
  btn.textContent = 'Show everything';
  btn.onclick = () => { scopeEl.value = '0'; changeScope(); };
  foot.appendChild(btn);
  return foot;
}

function convQuery(offset) {
  return '/api/conversations?since=' + since + '&limit=' + CONV_PAGE +
    (offset ? '&offset=' + offset : '');
}

async function loadConversations() {
  const convs = await api(convQuery(0)) || [];
  if (mode !== 'messages') return; // the tab changed while loading
  convLoaded = convs.length;
  convDone = convs.length < CONV_PAGE;
  renderConvList(convs);
}

async function appendConversations() {
  if (mode !== 'messages' || convDone || convLoading || searchEl.value.trim()) return;
  convLoading = true;
  try {
    const convs = await api(convQuery(convLoaded)) || [];
    convDone = convs.length < CONV_PAGE;
    convLoaded += convs.length;
    const frag = document.createDocumentFragment();
    for (const c of convs) frag.appendChild(convRow(c));
    listEl.querySelector('.listend')?.remove();
    listEl.appendChild(frag);
    if (convDone) listEl.appendChild(listFooter(convLoaded));
  } finally {
    convLoading = false;
  }
}

// Re-fetch exactly what is on screen so appended pages are not lost.
async function refreshConvList() {
  const limit = Math.min(Math.max(convLoaded, CONV_PAGE), 1000);
  const convs = await api('/api/conversations?since=' + since + '&limit=' + limit) || [];
  convLoaded = convs.length;
  renderConvList(convs);
}

function changeScope() {
  localStorage.setItem('smsd.scope', scopeEl.value);
  applyScope();
  active = null;
  thread = null;
  threadEl.replaceChildren(Object.assign(document.createElement('div'),
    { className: 'empty', textContent: 'Select a conversation' }));
  listEl.scrollTop = 0;
  loadConversations();
}
scopeEl.addEventListener('change', changeScope);

listEl.addEventListener('scroll', () => {
  if (listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight - 200) appendConversations();
});

/* ---------- thread ---------- */

function bubbleEl(m) {
  const div = document.createElement('div');
  div.className = 'bubble ' + (m.received ? 'in' : 'out') + (m.deleted_at ? ' deleted' : '');
  div.innerHTML = esc(m.body) + '<span class="ts">' + esc(fmtDate(m.date)) + deletedNote(m) + '</span>';
  return div;
}

// deleted_at is when smsd noticed, not when the phone deleted it, hence the
// wording.
function deletedNote(m) {
  return m.deleted_at
    ? ' · <span title="noticed ' + esc(fmtDate(m.deleted_at)) + '">deleted from phone</span>'
    : '';
}

function threadTitle(address) {
  const row = listEl.querySelector('.conv[data-address="' + CSS.escape(address) + '"]');
  return (row && row.dataset.title) || address;
}

// opts.title names a thread that may not be in the list, and opts.all ignores
// the window — both for threads opened from a contact card.
async function openThread(address, opts = {}) {
  active = address;
  for (const el of listEl.querySelectorAll('.conv')) {
    el.classList.toggle('active', el.dataset.address === address);
  }

  const floor = opts.all ? 0 : since;
  const page = await api('/api/messages?address=' + encodeURIComponent(address) +
    '&since=' + floor + '&limit=' + MSG_PAGE);
  const msgs = page.messages || [];
  // thread.since mirrors the window until the reader asks for older messages,
  // at which point it drops to 0 for this thread only.
  thread = { address, since: floor, hasMore: page.has_more, oldest: msgs[0] || null,
    title: opts.title };

  threadEl.replaceChildren();
  const h2 = document.createElement('h2');
  h2.textContent = opts.title || threadTitle(address);
  threadEl.appendChild(h2);

  const more = document.createElement('button');
  more.className = 'loadmore';
  more.onclick = loadOlder;
  threadEl.appendChild(more);
  labelLoadMore(more);

  const bubbles = document.createElement('div');
  bubbles.id = 'bubbles';
  if (msgs.length === 0) {
    bubbles.innerHTML = '<div class="empty">No messages</div>';
  } else {
    const frag = document.createDocumentFragment();
    for (const m of msgs) frag.appendChild(bubbleEl(m));
    bubbles.appendChild(frag);
  }
  threadEl.appendChild(bubbles);
  threadEl.scrollTop = threadEl.scrollHeight;
}

// Inside the window the button pages backwards; once the window is exhausted it
// becomes the way out of the window for this thread.
function labelLoadMore(btn) {
  if (!thread) { btn.hidden = true; return; }
  if (thread.hasMore) {
    btn.textContent = '↑ Load ' + MSG_PAGE + ' older';
    btn.hidden = false;
  } else if (thread.since > 0) {
    btn.textContent = '↑ Load messages older than the ' + scopeLabel();
    btn.hidden = false;
  } else {
    btn.hidden = true;
  }
}

async function loadOlder() {
  if (!thread || !thread.oldest) return;
  // Out of messages inside the window: widen this thread to the full history.
  if (!thread.hasMore && thread.since > 0) thread.since = 0;

  const btn = threadEl.querySelector('.loadmore');
  const bubbles = document.getElementById('bubbles');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  try {
    const page = await api('/api/messages?address=' + encodeURIComponent(thread.address) +
      '&since=' + thread.since +
      '&before_date=' + thread.oldest.date + '&before_id=' + thread.oldest.android_id +
      '&limit=' + MSG_PAGE);
    const msgs = page.messages || [];
    thread.hasMore = page.has_more;
    if (msgs.length) thread.oldest = msgs[0];
    else thread.exhausted = true;

    // Prepending grows the document upwards, so shift the scroll offset by the
    // height gained to keep the reader looking at the same message.
    const before = threadEl.scrollHeight;
    const frag = document.createDocumentFragment();
    for (const m of msgs) frag.appendChild(bubbleEl(m));
    bubbles.insertBefore(frag, bubbles.firstChild);
    threadEl.scrollTop += threadEl.scrollHeight - before;
  } finally {
    btn.disabled = false;
    if (thread.exhausted) btn.hidden = true; else labelLoadMore(btn);
  }
}

/* ---------- search ---------- */

let searchTimer = null;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  if (mode === 'contacts') { renderContactList(); return; }
  const q = searchEl.value.trim();
  searchTimer = setTimeout(() => q ? runSearch(q) : loadConversations(), 200);
});

async function runSearch(q) {
  const hits = await api('/api/search?q=' + encodeURIComponent(q)) || [];
  active = null;
  thread = null;
  for (const el of listEl.querySelectorAll('.conv')) el.classList.remove('active');

  let html = '<h2>' + hits.length + ' result' + (hits.length === 1 ? '' : 's') + ' for “' + esc(q) + '”</h2>';
  if (hits.length === 0) html += '<div class="empty">No matches</div>';
  for (const m of hits) {
    html += '<div class="bubble ' + (m.received ? 'in' : 'out') + (m.deleted_at ? ' deleted' : '') + ' searchhit">' +
      '<div class="addr">' + esc(m.address) + ' · ' + esc(fmtDate(m.date)) + deletedNote(m) + '</div>' +
      esc(m.body) + '</div>';
  }
  threadEl.innerHTML = html;
  threadEl.scrollTop = 0;
}

/* ---------- contacts ---------- */

// A phone book is a few hundred entries, so the whole list is fetched when the
// tab opens and filtered here rather than paged from the server.
const KIND_TITLES = {
  phone: 'Phone', email: 'Email', address: 'Address', organization: 'Organization',
  website: 'Website', event: 'Date', nickname: 'Nickname', note: 'Note',
};

let contacts = [];         // /api/contacts, everything including deleted
let activeContact = null;  // id of the open card

async function loadContacts() {
  contacts = await api('/api/contacts') || [];
  if (mode === 'contacts') renderContactList();
}

function contactTitle(c) {
  return c.name || c.phone || '(no name)';
}

function renderContactList() {
  const q = searchEl.value.trim().toLowerCase();
  const digits = q.replace(/\D/g, '');
  const filter = cfilterEl.value;
  const shown = contacts.filter(c =>
    (filter === 'all' || (filter === 'deleted') === Boolean(c.deleted_at)) &&
    (!q || c.name.toLowerCase().includes(q) ||
      (digits && c.phone.replace(/\D/g, '').includes(digits))));

  const frag = document.createDocumentFragment();
  for (const c of shown) {
    const div = document.createElement('div');
    div.className = 'conv' + (c.deleted_at ? ' deleted' : '') + (c.id === activeContact ? ' active' : '');
    div.dataset.contact = c.id;
    div.innerHTML =
      '<div class="name">' + esc(contactTitle(c)) + (c.starred ? '<span class="star">★</span>' : '') +
      (c.deleted_at ? '<span class="gone">DELETED</span>' : '') + '</div>' +
      (c.name && c.phone ? '<div class="meta">' + esc(c.phone) + '</div>' : '');
    div.onclick = () => openContact(c.id);
    frag.appendChild(div);
  }
  const foot = document.createElement('div');
  foot.className = 'listend';
  const gone = contacts.filter(c => c.deleted_at).length;
  foot.textContent = shown.length + ' of ' + contacts.length + ' contacts' +
    (gone ? ' · ' + gone + ' deleted from the phone' : '');
  frag.appendChild(foot);
  listEl.replaceChildren(frag);
}

async function openContact(id) {
  activeContact = id;
  for (const el of listEl.querySelectorAll('.conv')) {
    el.classList.toggle('active', Number(el.dataset.contact) === id);
  }
  const c = await api('/api/contact?id=' + id);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h2>' + esc(contactTitle(c)) + (c.starred ? '<span class="star">★</span>' : '') +
    (c.deleted_at ? '<span class="gone">DELETED</span>' : '') + '</h2>' +
    (c.deleted_at ? '<div class="banner">Deleted from the phone · noticed ' + esc(fmtDate(c.deleted_at)) + '</div>' : '');

  let kind = null;
  for (const d of c.details) {
    if (d.kind !== kind) {
      kind = d.kind;
      card.appendChild(Object.assign(document.createElement('h3'), { textContent: KIND_TITLES[kind] || kind }));
    }
    const row = document.createElement('div');
    row.className = 'field' + (d.deleted_at ? ' deleted' : '');
    row.innerHTML = '<span class="label">' + esc(d.label) + '</span>' +
      '<span class="value">' + detailValue(d) + '</span>' +
      (d.deleted_at ? '<span class="gone" title="noticed ' + esc(fmtDate(d.deleted_at)) + '">REMOVED</span>' : '');
    if (d.conversation) {
      const btn = document.createElement('button');
      btn.textContent = 'Messages →';
      btn.onclick = () => showConversation(d.conversation, contactTitle(c));
      row.appendChild(btn);
    }
    card.appendChild(row);
  }
  if (c.details.length === 0) {
    card.appendChild(Object.assign(document.createElement('div'), { className: 'empty', textContent: 'No details' }));
  }
  threadEl.replaceChildren(card);
  threadEl.scrollTop = 0;
}

// Values are shown as text; only e-mail and plain http(s) links become links,
// so nothing stored on the phone can smuggle in a javascript: URL.
function detailValue(d) {
  const v = esc(d.value);
  if (d.kind === 'email') return '<a href="mailto:' + v + '">' + v + '</a>';
  if (d.kind === 'website' && /^https?:\/\//i.test(d.value)) {
    return '<a href="' + v + '" target="_blank" rel="noopener noreferrer">' + v + '</a>';
  }
  return v;
}

async function showConversation(address, title) {
  await setMode('messages');
  await openThread(address, { title, all: true });
}

/* ---------- mode ---------- */

const tabs = { messages: document.getElementById('tab-messages'), contacts: document.getElementById('tab-contacts') };

async function setMode(m) {
  if (m === mode) return;
  mode = m;
  for (const [k, el] of Object.entries(tabs)) el.classList.toggle('on', k === m);
  document.getElementById('scope-wrap').hidden = m !== 'messages';
  document.getElementById('cfilter-wrap').hidden = m !== 'contacts';
  searchEl.value = '';
  searchEl.placeholder = m === 'messages' ? 'Search name, number or message…' : 'Search name or number…';
  active = null;
  thread = null;
  activeContact = null;
  threadEl.replaceChildren(Object.assign(document.createElement('div'),
    { className: 'empty', textContent: m === 'messages' ? 'Select a conversation' : 'Select a contact' }));
  listEl.scrollTop = 0;
  if (m === 'messages') await loadConversations(); else await loadContacts();
}
tabs.messages.onclick = () => setMode('messages');
tabs.contacts.onclick = () => setMode('contacts');

cfilterEl.addEventListener('change', () => {
  localStorage.setItem('smsd.cfilter', cfilterEl.value);
  renderContactList();
});

/* ---------- refresh ---------- */

// Polling a fingerprint instead of the whole list means an idle viewer does no
// rendering work at all, and a busy one only redraws once per actual change.
async function poll() {
  if (mode !== 'messages' || searchEl.value.trim()) return;
  const s = await api('/api/state');
  const token = s.count + ':' + s.max_id + ':' + s.deleted;
  if (token === lastToken) return;
  const first = lastToken === null;
  lastToken = token;
  if (first) return;

  await refreshConvList();
  // Only pull new messages into an open thread when the reader is already at
  // the bottom; otherwise a refresh would yank them away from what they read.
  if (thread && threadEl.scrollTop + threadEl.clientHeight >= threadEl.scrollHeight - 40) {
    await openThread(thread.address, { title: thread.title, all: thread.since === 0 && since > 0 });
  }
}

const saved = localStorage.getItem('smsd.scope');
if (saved !== null && [...scopeEl.options].some(o => o.value === saved)) scopeEl.value = saved;
const savedFilter = localStorage.getItem('smsd.cfilter');
if (savedFilter !== null && [...cfilterEl.options].some(o => o.value === savedFilter)) cfilterEl.value = savedFilter;
applyScope();
loadConversations().then(poll);
setInterval(() => poll().catch(() => {}), 5000);
</script>
</body>
